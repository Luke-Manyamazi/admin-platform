# =============================================================================
# ADMIN Platform — Docker Compose (local full-stack)
#
# Prerequisites:
#   cp .env.docker.example .env
#   # fill in all REQUIRED values, then:
#   docker compose up --build
#
# Port map (host-accessible):
#   3000  web          — Next.js buyer portal
#   3001  api-gateway  — NestJS (sole public entry point for all API calls)
#   3002  admin        — Next.js ops dashboard
#   5432  postgres     — bound to 127.0.0.1 only (remove in prod)
#   6379  redis        — bound to 127.0.0.1 only (remove in prod)
#
# Microservices (factory:3010, orders:3011, notifications:3012, payments:3013)
# live on the internal admin_net network only — never reachable from the host.
#
# DB migrations:
#   The db-migrate service runs `prisma db push` on every `docker compose up`.
#   When you add the first real migration run instead:
#     docker compose run --rm db-migrate npx prisma migrate deploy
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admin_platform_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - admin_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - admin_net
    restart: unless-stopped

  # ── Schema migration (one-shot — exits 0 before services start) ─────────────
  # Uses the `deps` build stage so the prisma CLI (devDep) is available.
  db-migrate:
    build:
      context: .
      dockerfile: services/factory/Dockerfile
      target: deps
    working_dir: /workspace/packages/database
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/admin_platform_dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - admin_net

  # ── NestJS microservices (internal network only) ────────────────────────────

  factory:
    build:
      context: .
      dockerfile: services/factory/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3010"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/admin_platform_dev
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AWS_REGION: ${AWS_REGION:-af-south-1}
      AWS_EVENTBRIDGE_BUS_NAME: ${AWS_EVENTBRIDGE_BUS_NAME:-admin-platform-events}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - admin_net
    restart: unless-stopped

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3011"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/admin_platform_dev
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AWS_REGION: ${AWS_REGION:-af-south-1}
      AWS_EVENTBRIDGE_BUS_NAME: ${AWS_EVENTBRIDGE_BUS_NAME:-admin-platform-events}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - admin_net
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3012"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/admin_platform_dev
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AWS_REGION: ${AWS_REGION:-af-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-noreply@admin-platform.camluk.com}
      SES_FROM_NAME: ${SES_FROM_NAME:-ADMIN Platform}
      SES_DRY_RUN: ${SES_DRY_RUN:-true}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}
      BUYER_PORTAL_URL: ${BUYER_PORTAL_URL:-http://localhost:3000}
      FACTORY_PORTAL_URL: ${FACTORY_PORTAL_URL:-http://localhost:3000/factory}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - admin_net
    restart: unless-stopped

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3013"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/admin_platform_dev
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AWS_REGION: ${AWS_REGION:-af-south-1}
      AWS_EVENTBRIDGE_BUS_NAME: ${AWS_EVENTBRIDGE_BUS_NAME:-admin-platform-events}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      COMMISSION_RATE_PERCENT: ${COMMISSION_RATE_PERCENT:-8}
      PEACH_ENTITY_ID: ${PEACH_ENTITY_ID:-}
      PEACH_ACCESS_TOKEN: ${PEACH_ACCESS_TOKEN:-}
      PEACH_WEBHOOK_SECRET: ${PEACH_WEBHOOK_SECRET}
      PEACH_API_BASE_URL: ${PEACH_API_BASE_URL:-https://testsecure.peachpayments.com}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH}
      FLUTTERWAVE_API_BASE_URL: ${FLUTTERWAVE_API_BASE_URL:-https://api.flutterwave.com/v3}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - admin_net
    restart: unless-stopped

  # ── API Gateway — sole NestJS service reachable from the host ───────────────

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/admin_platform_dev
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      FACTORY_SERVICE_URL: http://factory:3010
      ORDERS_SERVICE_URL: http://orders:3011
      NOTIFICATIONS_SERVICE_URL: http://notifications:3012
      PAYMENTS_SERVICE_URL: http://payments:3013
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      factory:
        condition: service_started
      orders:
        condition: service_started
      notifications:
        condition: service_started
      payments:
        condition: service_started
    networks:
      - admin_net
    restart: unless-stopped

  # ── Next.js frontends ───────────────────────────────────────────────────────
  # NEXT_PUBLIC_* vars are baked in at build time by next build — they are
  # passed as Docker build ARGs, not runtime env vars.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_URL: ${WEB_AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
      - api-gateway
    networks:
      - admin_net
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_URL: ${ADMIN_AUTH_URL:-http://localhost:3002}
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
      - api-gateway
    networks:
      - admin_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  admin_net:
    driver: bridge
