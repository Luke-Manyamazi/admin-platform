name: API Gateway Build

on:
  push:
    paths:
      - 'apps/api-gateway/**'
      - 'packages/config/**'
      - 'packages/database/**'
      - 'packages/types/**'
      - 'packages/events/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/api-gateway-build.yml'
  pull_request:
    paths:
      - 'apps/api-gateway/**'
      - 'packages/config/**'
      - 'packages/database/**'
      - 'packages/types/**'
      - 'packages/events/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/api-gateway-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API gateway
        run: pnpm --filter @admin-platform/api-gateway build

      - name: Verify gateway entrypoint
        run: test -f apps/api-gateway/dist/main.js
