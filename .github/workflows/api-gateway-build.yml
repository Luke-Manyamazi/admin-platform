name: API Gateway Build

on:
  push:
    paths:
      - 'apps/api-gateway/**'
      - 'packages/config/**'
      - 'packages/database/**'
      - 'packages/types/**'
      - 'packages/events/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/api-gateway-build.yml'
  pull_request:
    paths:
      - 'apps/api-gateway/**'
      - 'packages/config/**'
      - 'packages/database/**'
      - 'packages/types/**'
      - 'packages/events/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/api-gateway-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API gateway
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @admin-platform/api-gateway build 2>&1 | tee api-gateway-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-build-log
          path: api-gateway-build.log
          if-no-files-found: ignore

      - name: Fail when build fails
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Verify gateway entrypoint
        run: test -f apps/api-gateway/dist/main.js
